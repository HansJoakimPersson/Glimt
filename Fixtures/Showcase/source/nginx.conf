# Reverse proxy for the preview service.
worker_processes 2;

http {
    upstream preview_app {
        server 127.0.0.1:8080;
    }

    server {
        listen 8443 ssl;
        server_name preview.example.test;

        location / {
            proxy_set_header Host $host;
            proxy_pass http://preview_app;
        }

        location /static/ {
            root /srv/preview;
            try_files $uri =404;
        }
    }
}
