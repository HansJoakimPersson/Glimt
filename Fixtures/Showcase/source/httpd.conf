# TLS virtual host for the preview service.
ServerRoot "/usr/local/apache2"
Listen 8443
LoadModule ssl_module modules/mod_ssl.so

<VirtualHost *:8443>
    ServerName preview.example.test
    DocumentRoot "/srv/preview"
    ErrorLog logs/preview-error.log
    CustomLog logs/preview-access.log combined

    <Directory "/srv/preview">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
