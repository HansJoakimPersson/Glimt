name: Release

# Pushing a tag v<semver> that matches Config/Version.xcconfig builds, tests and packages it with
# ci.yml, then publishes a GitHub Release with the zip and its SHA-256 checksums. The notes are
# GitHub's generated changes since the previous release (see `scripts/version.sh --previous-tag`),
# preceded by the build identity and checksums. alpha, beta and rc versions are pre-releases.
# A stable release also carries Glimt-latest-macOS.zip, the target of releases/latest/download links.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: glimt-dist
          path: dist

      - name: Verify tag, artifact and checksums
        run: |
          bash scripts/version.sh --check-tag "$GITHUB_REF_NAME"
          test -f "dist/$(bash scripts/version.sh --get ARCHIVE_NAME)"
          (cd dist && shasum -a 256 -c "$(bash ../scripts/version.sh --get CHECKSUMS_NAME)")

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # ci.yml signs with a Developer ID and notarizes only when this secret is set.
          NOTARIZED: ${{ secrets.GLIMT_SIGN_IDENTITY != '' }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is already published; release a new build number instead"
            exit 1
          fi
          value() { bash scripts/version.sh --get "$1"; }
          previous="$(gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName' |
            bash scripts/version.sh --previous-tag)"
          {
            printf '**%s** · version %s, build %s · [installation](%s/blob/%s/README.md#installation)\n' \
              "$(value RELEASE_TITLE)" "$(value MARKETING_VERSION)" "$(value BUILD_NUMBER)" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            if [[ "$NOTARIZED" != true ]]; then
              printf '\n> [!NOTE]\n> This build is ad-hoc signed and not notarized. macOS asks you to approve its first launch in System Settings › Privacy & Security.\n'
            fi
            printf '\n### SHA-256 checksums\n\n```\n%s\n```\n' "$(cat "dist/$(value CHECKSUMS_NAME)")"
          } >"$RUNNER_TEMP/notes.md"
          flags=(--generate-notes)
          [[ -z "$previous" ]] || flags+=(--notes-start-tag "$previous")
          if [[ "$(value IS_PRERELEASE)" == true ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
            cp "dist/$(value ARCHIVE_NAME)" dist/Glimt-latest-macOS.zip
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$(value RELEASE_TITLE)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
